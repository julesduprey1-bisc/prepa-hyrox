<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E6EAEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prépa HYROX">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Prépa HYROX Lyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout : app mobile à une colonne, barre d'onglets fixée en bas, chaque vue = une pile de blocs.
   Univers : salle de box — gris acier, plaque de bumper jaune pour l'accent, bleu piste pour la course. */
:root{
  --bg:#E6EAEE;--panel:#F7F9FA;--ink:#1C2530;--muted:#5B6773;--line:#C9D1D8;
  --plate:#F2B705;--plate-ink:#1C2530;--done:#2F7A52;--miss:#B4372B;--warn:#9A5B00;
  --run:#2F5F8F;--band:rgba(47,95,143,.12);--soft:#EEF1F4;
  --font-d:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-b:Barlow,system-ui,-apple-system,sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A20;--panel:#1D252D;--ink:#E6EAEE;--muted:#93A0AC;--line:#2E3943;
  --done:#4FB47F;--miss:#E37466;--warn:#E0A040;--run:#7FB0E0;--band:rgba(127,176,224,.14);--soft:#232C35;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A20;--panel:#1D252D;--ink:#E6EAEE;--muted:#93A0AC;--line:#2E3943;
  --done:#4FB47F;--miss:#E37466;--warn:#E0A040;--run:#7FB0E0;--band:rgba(127,176,224,.14);--soft:#232C35;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-b);padding-inline:16px}
main{max-width:600px;margin:0 auto;padding-block:16px calc(var(--navh) + 32px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0}
h1{font-weight:800;font-size:34px;line-height:1}
h2{font-weight:700;font-size:24px;line-height:1.1}
h3{font-weight:600;font-size:19px;line-height:1.15}
p{margin:0}
.eyebrow{font:600 13px/1.2 var(--font-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.block{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font:600 17px var(--font-d);cursor:pointer;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;cursor:pointer;font:600 20px var(--font-b)}
.iconbtn[disabled]{opacity:.35;cursor:default}

/* Barre d'onglets */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav.tabbar button{min-height:50px;border:none;border-radius:10px;background:transparent;cursor:pointer;font:600 16px var(--font-d);letter-spacing:.03em;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabbar button[aria-selected="true"]{color:var(--ink);background:var(--soft)}
nav.tabbar button[aria-selected="true"] svg{stroke:var(--ink)}

/* Source */
.src{display:inline-flex;align-items:center;gap:6px;font:500 13px var(--font-b);color:var(--muted)}
.src i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.src.live i{background:var(--done)}
.src.warn i{background:var(--warn)}
.src button{border:none;background:none;text-decoration:underline;cursor:pointer;color:var(--ink);padding:4px}

/* En-tête de semaine */
.weekhead{display:flex;gap:10px;align-items:flex-end;justify-content:space-between}
.weekhead .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--plate);color:var(--plate-ink);font:600 14px var(--font-b)}
.tag.muted{background:var(--soft);color:var(--muted)}

/* Alerte */
.alert{border-left:6px solid var(--miss);background:var(--panel);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.alert.warn{border-left-color:var(--warn)}

/* Coach */
.coach{border-left:6px solid var(--plate)}
.coach ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Tuiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:440px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--panel);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font:700 28px/1 var(--font-d);font-variant-numeric:tabular-nums}
.tile b small{font:600 16px var(--font-d);color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--run);border-radius:3px}

/* Jours */
.day{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:none}
.day .d{font:700 18px/1 var(--font-d);display:flex;flex-direction:column;gap:3px}
.day .d small{font:500 13px var(--font-b);color:var(--muted)}
.day.today .d{color:var(--ink)}
.day.today{background:var(--soft);margin-inline:-16px;padding-inline:16px;border-radius:10px;border-top-color:transparent}
.items{display:flex;flex-direction:column;gap:8px;min-width:0}
.it{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.it .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.it .txt strong{font-weight:600}
.st{flex:0 0 auto;font:600 13px var(--font-b);padding:3px 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.st.fait{border-color:var(--done);color:var(--done)}
.st.manque{border-color:var(--miss);color:var(--miss)}
.st.jour{border-color:var(--plate);background:var(--plate);color:var(--plate-ink)}
.chip{display:inline-block;font:600 12px var(--font-b);letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--muted);margin-right:4px}
.chip.lock{background:var(--ink);color:var(--bg)}
.link{border:none;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:600 15px var(--font-b);text-align:left}

/* Aujourd'hui */
.todo{display:flex;flex-direction:column;gap:12px}
.todo .card{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.todo .card.k-run{border-color:var(--run)}
.todo .card.k-box{border-color:var(--ink)}
.proto{margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:3px}

/* Compteurs */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counter{border-left:4px solid var(--line);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.counter.miss{border-left-color:var(--miss)}
.counter.warn{border-left-color:var(--warn)}
.counter.ok{border-left-color:var(--done)}
.counter b{font:700 26px/1 var(--font-d);font-variant-numeric:tabular-nums}

/* Ressenti */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:transparent;cursor:pointer;font:700 20px var(--font-d)}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--miss)}
textarea{width:100%;min-height:70px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:400 16px var(--font-b);padding:10px;resize:vertical}

/* Tableaux */
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:600 12px var(--font-b);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.cur td{background:var(--soft)}
.pill{display:inline-block;font:600 13px var(--font-b);padding:1px 8px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--done);color:var(--done)}
.pill.ko{border-color:var(--miss);color:var(--miss)}
.pill.mid{border-color:var(--warn);color:var(--warn)}

/* Graphiques */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:500 11px var(--font-b);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--run)}
.chart .bar.cur{fill:var(--run);opacity:.55}
.chart .target{stroke:var(--plate);stroke-width:3;stroke-linecap:round}
.chart .hit{fill:transparent;cursor:pointer}
.chart .band{fill:var(--band)}
.chart .line{fill:none;stroke:var(--run);stroke-width:2}
.chart .pt{fill:var(--run);stroke:var(--panel);stroke-width:2}
.chart .pt.open{fill:var(--panel);stroke:var(--run);stroke-width:2}
.chart .exp{stroke:var(--plate);stroke-width:6;stroke-linecap:round}
.chart .lbl{fill:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:32px;display:flex;align-items:center}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font:500 13px/1.35 var(--font-b);padding:6px 9px;border-radius:8px;max-width:240px;white-space:pre-line}

/* Objectif */
.hero{display:flex;flex-direction:column;gap:6px;padding:20px 16px;background:var(--ink);color:var(--bg);border-radius:14px}
.hero .eyebrow{color:var(--plate)}
.hero h1{font-size:40px}
.hero .big{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.hero .big div{display:flex;flex-direction:column}
.hero .big b{font:800 30px/1 var(--font-d);font-variant-numeric:tabular-nums}
.hero .big small{font-size:13px;opacity:.75}
.phases{display:flex;flex-direction:column;gap:0}
.phase{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:8px 0}
.phase .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:4px;background:var(--panel)}
.phase.past .dot{background:var(--muted);border-color:var(--muted)}
.phase.now .dot{background:var(--plate);border-color:var(--plate)}
.phase.now strong{color:var(--ink)}
.hbar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:15px}
.hbar .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.hbar .track span{display:block;height:100%;background:var(--run);border-radius:5px}
.hbar.lim .track span{background:var(--miss)}

/* ===== Salle (checklists) ===== */
#v-salle .shead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.stabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stabs button{flex:1;min-width:22%;min-height:44px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:600 16px var(--font-d);cursor:pointer}
.stabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sbar{height:10px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden}
.sbar span{display:block;height:100%;width:0;background:var(--plate);transition:width .25s}
.scount{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:14px}
.slist{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.ex{background:var(--panel);border-radius:14px;padding:14px 14px 8px;border-left:6px solid var(--plate)}
.ex.complete{border-left-color:var(--done)}
.ex h2{font-size:22px;margin:0 0 2px}
.ex .hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.ex .rest{display:inline-block;margin:2px 0 6px;padding:2px 10px;border-radius:999px;background:var(--plate);color:var(--plate-ink);font:600 14px var(--font-b)}
.ex .circ{margin:0 0 12px;padding-left:22px;font-size:16px}
.ex .circ li{margin:0 0 4px}
.setblk{margin:0 0 12px}
button.set{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;margin:0 0 6px;padding:0 14px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:600 18px var(--font-b);text-align:left;cursor:pointer}
.box{flex:0 0 28px;height:28px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
button.set[aria-pressed="true"]{border-color:var(--done);color:var(--muted)}
button.set[aria-pressed="true"] .box{background:var(--done);border-color:var(--done)}
button.set[aria-pressed="true"] .box::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
button.set[aria-pressed="true"] .lbl{text-decoration:line-through}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.step{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.step button{width:40px;min-height:46px;border:none;background:transparent;color:var(--ink);font:600 22px var(--font-b);cursor:pointer}
.step span{min-width:64px;text-align:center;font:600 17px var(--font-b)}
.recap{background:var(--panel);border-radius:14px;padding:16px;border-left:6px solid var(--done);display:flex;flex-direction:column;gap:10px}
.recap pre{white-space:pre-wrap;font:400 15px/1.5 var(--font-b);margin:0}
.reset{display:block;margin:6px auto 0;background:none;border:none;color:var(--muted);font:600 15px var(--font-b);text-decoration:underline;padding:10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.sbar span{transition:none}}
/* Reporter / annuler */
.it.cancel .txt strong{text-decoration:line-through;color:var(--muted)}
.st.annule{border-style:dashed}
.chip.moved{background:var(--band);color:var(--run)}
.edit{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding:10px;border-radius:10px;background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{min-height:40px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font:600 15px var(--font-b)}
.chipbtn.danger{border-color:var(--miss);color:var(--miss)}
.small-link{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <section id="v-semaine" class="stack" aria-label="Semaine"></section>
  <section id="v-course" class="stack" aria-label="Course" hidden></section>
  <section id="v-salle" aria-label="Salle" hidden>
    <div class="shead">
      <div class="stabs" role="tablist" id="stabs"></div>
      <h1 id="stitle" style="font-size:30px"></h1>
      <div class="sbar"><span id="sfill"></span></div>
      <div class="scount"><span id="scount"></span><span id="sstatus"></span></div>
    </div>
    <div class="slist" id="slist"></div>
    <div class="block" id="ssaved" style="margin-top:14px"></div>
  </section>
  <section id="v-objectif" class="stack" aria-label="Objectif" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" data-v="semaine" id="t-semaine"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</button>
    <button role="tab" data-v="course" id="t-course"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16v-4M11 16V8M16 16v-6M21 16V5"/></svg>Course</button>
    <button role="tab" data-v="salle" id="t-salle"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Salle</button>
    <button role="tab" data-v="objectif" id="t-objectif"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5"/></svg>Lyon</button>
  </div>
</nav>
<div id="tip" hidden></div>

<script>
/* ================= Outils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr=(n,d=1)=>Number(n).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addD(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function monday(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function dm(s){return s.slice(8,10)+"/"+s.slice(5,7)}
const JOURS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const JOURSL=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function longDate(s){const d=parse(s);return JOURSL[(d.getDay()+6)%7]+" "+d.getDate()+" "+MOIS[d.getMonth()]}
const TODAY=ymd(new Date());
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ================= Programme S7 → S12 (fixé le 12/10/2026) ================= */
const EF_TXT="FC 130–140, plafond dur 142. Allure libre, ~8:00–8:30/km à la reprise.";
const LD_TXT="En fin d'EF : 6 × 15 s rapides, récupération complète en marchant.";
const REF_PROTO=["10' d'échauffement progressif","30' continues, FC tenue à 135 ± 3, sans regarder l'allure","Terrain plat, pas de vent","Attendu après 21 jours d'arrêt : indice entre 14,5 et 15,2 (16,20 le 09/09). C'est mécanique, pas une régression."];
const WEEKS=[
 {s:7,tag:"Reprise",km:6.5,mer:{t:"EF 25'",min:25,km:3.0},dim:{t:"EF 30'",min:30,km:3.5},
  notes:{0:"Pas remis à 100 % : rien aujourd'hui.",1:"Priorité n°1 de la semaine (13 jours sans box). Allégée si fatigue.",4:"RPE 7 max : première séance jambes depuis 3 semaines."}},
 {s:8,tag:"Point de référence",km:7.5,mer:{t:"EF 30'",min:30,km:3.7},sam:{t:"EF 30' de référence",min:30,km:3.8,ref:true},dim:null,
  notes:{4:"Léger, veille de référence. Ou repos."}},
 {s:9,tag:"Lignes droites",km:8.0,mer:{t:"EF 30' + 6 lignes droites",min:30,ld:true},dim:{t:"EF 35'",min:35}},
 {s:10,tag:"Construction",km:9.0,mer:{t:"EF 35' + 6 lignes droites",min:35,ld:true},dim:{t:"EF 40'",min:40}},

function volChart(A){
 const start="2026-07-06",end=WEEKS[WEEKS.length-1].start,cw=monday(TODAY);
 const data=[];for(let w=start;w<=end;w=addD(w,7)){const e=addD(w,6);const p=WEEKS.find(x=>x.start===w);
  data.push({w,km:A.filter(a=>a.k==="run"&&a.d>=w&&a.d<=e).reduce((s,a)=>s+a.km,0),target:p?p.km:null,s:p?p.s:null,future:w>cw,cur:w===cw})}
 const W=360,H=200,m={l:24,r:4,t:10,b:22},iw=W-m.l-m.r,ih=H-m.t-m.b;
 const ymax=Math.ceil(Math.max(12,...data.map(d=>Math.max(d.km,d.target||0)))/4)*4;
 const y=v=>m.t+ih-v/ymax*ih,bw=iw/data.length;
 let g="";for(let v=0;v<=ymax;v+=4)g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
 data.forEach((d,i)=>{const x=m.l+i*bw,cx=x+bw/2,w=Math.max(4,bw*.62),bx=cx-w/2;
  if(!d.future&&d.km>0){const top=y(d.km),hgt=y(0)-top,r=Math.min(4,hgt);
   g+=`<path class="bar ${d.cur?"cur":""}" d="M${bx},${y(0)}V${top+r}Q${bx},${top} ${bx+r},${top}H${bx+w-r}Q${bx+w},${top} ${bx+w},${top+r}V${y(0)}Z"/>`}
  if(d.target!=null)g+=`<line class="target" x1="${bx-2}" x2="${bx+w+2}" y1="${y(d.target)}" y2="${y(d.target)}"/>`;
  if(i%3===0||d.cur)g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" ${d.cur?'class="lbl"':""}>${d.s?"S"+d.s:dm(d.w)}</text>`;
  const tipT=`Semaine du ${dm(d.w)}${d.s?" · S"+d.s:""}\n${d.future?"à venir":fr(d.km)+" km de course"}${d.target!=null?"\nobjectif "+fr(d.target)+" km":""}`;
  g+=`<rect class="hit" x="${x}" y="${m.t}" width="${bw}" height="${ih}" tabindex="0" data-tip="${esc(tipT)}"><title>${esc(tipT)}</title></rect>`});
 const rows=data.filter(d=>!d.future||d.target!=null).map(d=>`<tr class="${d.cur?"cur":""}"><td class="num">${dm(d.w)}${d.s?" · S"+d.s:""}</td><td class="r">${d.future?"—":fr(d.km)}</td><td class="r">${d.target!=null?fr(d.target):"—"}</td></tr>`).join("");
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilomètres de course par semaine depuis juillet">${g}</svg>
  <div class="legend"><span><i style="background:var(--run)"></i>km de course réalisés</span><span><i style="background:var(--plate);height:3px"></i>objectif du programme</span></div>
  <details><summary>Voir les chiffres</summary><div class="tablewrap"><table><thead><tr><th>Semaine</th><th class="r">Réalisé</th><th class="r">Objectif</th></tr></thead><tbody>${rows}</tbody></table></div></details>`}

 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Indice d'efficacité aérobie des EF">${g}</svg>

  {t:"Adducteurs machine",rest:"1'",h:"Chiffre affiché sur la machine. Amplitude contrôlée, pas de rebond en ouverture.",l:[L("",5)],s:rep([40],12,3)},
  {t:"Développé militaire",rest:"2'",h:"Haltères : poids d’un haltère. Barre : poids total. Reste gainé.",l:[L("",2)],s:rep([20],8,4)},
  {t:"Montées de mollets unilatérales",rest:"45\"",h:"Reps par jambe, lent. Prévention périostite.",l:[],s:rep([],10,3)},
  CARDIO,
  ABS]},
 legsB:{name:"Jambes B",title:"Jambes B — thruster / presse",ex:[
  {t:"Squat overhead",rest:"2'",h:"Poids total, barre comprise. Barre légère : technique et mobilité.",l:[L("",5)],s:rep([30],6,4)},
  {t:"Thrusters",rest:"2'",h:"Poids total, barre comprise. Fluide, rythme wall ball.",l:[L("",5)],s:rep([30],10,3)},
  {t:"Presse à cuisses",rest:"2'",h:"Disques chargés uniquement, sans le chariot. Genoux dans l'axe.",l:[L("",10)],s:rep([120],12,3)},
  {t:"Hip thrust",rest:"1'30",h:"Poids total, barre comprise. Pause 1 s en haut.",l:[L("",10)],s:rep([60],10,3)},
  {t:"Leg extension",rest:"1'",h:"Chiffre affiché sur la machine. Si le genou opéré proteste, limite la fin d'extension.",l:[L("",5)],s:rep([40],12,3)},
  {t:"Montées de mollets unilatérales",rest:"45\"",h:"Reps par jambe, lent.",l:[],s:rep([],10,3)},
  CARDIO,
  ABS]}
};
let st=ld("salle-v4",null);
if(!st){st={};const v3=ld("salle-v3",null);
 for(const id in S)st[id]={done:(v3&&v3[id]&&id==="push")?v3[id].done:[],val:{}}}
for(const id in S)if(!st[id])st[id]={done:[],val:{}};
if(!st.migrated){
 const v3=ld("salle-v3",null),v2=ld("salle-v2",null),v1=ld("push-pecs-triceps-v1",null);
 const oldDone=(v3&&v3.push&&v3.push.done&&v3.push.done.length)?v3.push.done:(v2&&v2.push&&v2.push.done&&v2.push.done.length)?v2.push.done:v1;
 if(oldDone&&oldDone.length&&!st.push.done.length)st.push.done=oldDone;
 const oldReps=(v3&&v3.push&&v3.push.reps&&v3.push.reps[2])||(v2&&v2.push&&v2.push.reps&&v2.push.reps[2])||ld("push-dips-reps-v1",null);
 if(oldReps){st.push.val[2]=st.push.val[2]||{};oldReps.forEach((r,j)=>{st.push.val[2][j]={kg:[],r}})}
 st.migrated=true;sv("salle-v4",st)}
if(!st.pullV5){st.pull={done:[],val:{}};st.pullV5=true;sv("salle-v4",st)}
function saveSt(){sv("salle-v4",st)}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const now=new Date(),day=now.getDay(),legsToday=isoWeek(now)%2===0?"legsA":"legsB";
const def=day===3?"pull":day===5?legsToday:"push";
let cur=ld("salle-tab-day",null)===now.toDateString()?ld("salle-tab",def):def;
if(!S[cur])cur=def;
let SAVE_MSG="";
function openSalle(id){cur=id==="legs"?legsToday:id;sv("salle-tab",cur);sv("salle-tab-day",now.toDateString());renderSalle();show("salle")}
function val(id,i,j){const d=S[id].ex[i].s[j],v=(st[id].val[i]||{})[j];
 return {kg:(v&&v.kg)?v.kg.slice():d[0].slice(),r:(v&&v.r!=null)?v.r:d[1]}}
function setVal(id,i,j,v){st[id].val[i]=st[id].val[i]||{};st[id].val[i][j]=v;saveSt();renderSalle()}
function fmtK(n){return String(n).replace(".",",")}
function stepper(text,dec,inc){const w=document.createElement("div");w.className="step";
 const m=document.createElement("button"),p=document.createElement("button"),v=document.createElement("span");
 m.textContent="−";p.textContent="+";v.textContent=text;m.setAttribute("aria-label","Moins");p.setAttribute("aria-label","Plus");
 m.onclick=dec;p.onclick=inc;w.append(m,v,p);return w}
function summary(ex,v){const a=[];
 if(ex.l.length)a.push(ex.l.map((l,m)=>(l.n?l.n+" ":"")+fmtK(v.kg[m])+" kg").join(" · "));
 if(v.r!=null)a.push((ex.l.length?"× ":"")+v.r+" "+(ex.u||"reps"));
 return a.join(" ")}
function recapLines(){const sess=S[cur];return sess.ex.map((ex,i)=>{const sets=ex.s.map((_,j)=>summary(ex,val(cur,i,j))).filter(Boolean);return ex.t+(sets.length?" : "+sets.join(" / "):" : fait")})}
function saveSeance(){const sess=S[cur];const rec={date:TODAY,seance:cur,titre:sess.title,lignes:recapLines(),enregistreLe:new Date().toISOString()};
 SEANCES=[rec,...SEANCES.filter(x=>!(x.date===TODAY&&x.seance===cur))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,80);sv("prepa-seances",SEANCES);
 SAVE_MSG="Enregistrée. Envoie-la moi depuis l'onglet Semaine.";renderSalle();renderSemaine()}
function renderSalle(){
 const tabs=$("#stabs"),list=$("#slist");tabs.innerHTML="";
 for(const id in S){const b=document.createElement("button");b.setAttribute("role","tab");b.setAttribute("aria-selected",id===cur);b.textContent=S[id].name;
  b.onclick=()=>{cur=id;SAVE_MSG="";sv("salle-tab",id);sv("salle-tab-day",now.toDateString());renderSalle();window.scrollTo(0,0)};tabs.appendChild(b)}
 const sess=S[cur],s=st[cur],done=new Set(s.done);
 $("#stitle").textContent=sess.title;list.innerHTML="";
 const total=sess.ex.reduce((n,e)=>n+e.s.length,0);
 sess.ex.forEach((ex,i)=>{
  const sec=document.createElement("div");sec.className="ex";
  if(ex.s.every((_,j)=>done.has(i+"-"+j)))sec.classList.add("complete");
  sec.innerHTML=`<h2>${ex.t}</h2>${ex.rest?`<p class="rest">Repos : ${ex.rest}</p>`:""}<p class="hint">${ex.h}</p>${ex.list?`<ol class="circ">${ex.list.map(x=>`<li>${x}</li>`).join("")}</ol>`:""}`;
  ex.s.forEach((_,j)=>{
   const id=i+"-"+j,v=val(cur,i,j),blk=document.createElement("div");blk.className="setblk";
   const b=document.createElement("button");b.className="set";b.setAttribute("aria-pressed",done.has(id));
   b.innerHTML=`<span class="box"></span><span class="lbl"></span>`;
   const lab=(ex.s.length>1?(ex.t.startsWith("Tri-set")||ex.t.startsWith("Superset")?"Tour ":"Série ")+(j+1):"")+(summary(ex,v)?" — "+summary(ex,v):"");
   b.querySelector(".lbl").textContent=lab;
   b.onclick=()=>{done.has(id)?done.delete(id):done.add(id);s.done=[...done];saveSt();renderSalle()};
   blk.appendChild(b);
   const ctl=document.createElement("div");ctl.className="ctl";
   ex.l.forEach((l,m)=>ctl.appendChild(stepper((l.n?l.n+" ":"")+fmtK(v.kg[m])+" kg",
    ()=>{v.kg[m]=Math.max(0,+(v.kg[m]-l.k).toFixed(1));setVal(cur,i,j,v)},
    ()=>{v.kg[m]=+(v.kg[m]+l.k).toFixed(1);setVal(cur,i,j,v)})));
   if(v.r!=null){const rs=ex.rs||1;ctl.appendChild(stepper(v.r+" "+(ex.u||"reps"),()=>{v.r=Math.max(rs,v.r-rs);setVal(cur,i,j,v)},()=>{v.r=Math.min(ex.u==="s"?300:ex.u?120:60,v.r+rs);setVal(cur,i,j,v)}))}
   if(ctl.children.length)blk.appendChild(ctl);
   sec.appendChild(blk)});
  list.appendChild(sec)});
 if(done.size===total){
  const txt=sess.title+" — "+now.toLocaleDateString("fr-FR")+"\n"+recapLines().join("\n");
  const rc=document.createElement("div");rc.className="recap";
  rc.innerHTML=`<h2>Séance terminée</h2><pre></pre><div class="row"><button class="btn" id="ssave">Enregistrer dans mon suivi</button><button class="btn ghost" id="scopy">Copier le récap</button></div><p class="muted small" id="smsg"></p>`;
  rc.querySelector("pre").textContent=txt;
  rc.querySelector("#smsg").textContent=SAVE_MSG||(DB?"Gardée sur ce téléphone. Envoie-la moi depuis l'onglet Semaine.":"Enregistrement indisponible ici : copie le récap dans le chat.");
  const sb=rc.querySelector("#ssave");if(!DB)sb.disabled=true;sb.onclick=()=>{sb.disabled=true;saveSeance()};
  rc.querySelector("#scopy").onclick=()=>{navigator.clipboard.writeText(txt).then(()=>{rc.querySelector("#smsg").textContent="Récap copié."}).catch(()=>{const r=document.createRange();r.selectNodeContents(rc.querySelector("pre"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);rc.querySelector("#smsg").textContent="Texte sélectionné : copie-le."})};
  list.prepend(rc)}
 const r=document.createElement("button");r.className="reset";r.textContent="Nouvelle séance (décoche tout, garde tes charges)";
 r.onclick=()=>{s.done=[];SAVE_MSG="";saveSt();renderSalle()};list.appendChild(r);
 $("#sfill").style.width=(done.size/total*100)+"%";
 $("#scount").textContent=done.size+" / "+total+" séries";
 $("#sstatus").textContent=done.size===total?"Séance terminée":"";
 renderSaved()}
function renderSaved(){
 const el=$("#ssaved");
 if(!SEANCES.length){el.innerHTML=`<h3>Séances enregistrées</h3><p class="muted small">${DB?"Rien encore. Coche toutes les séries, puis « Enregistrer dans mon suivi ».":"Visible quand le suivi est chargé."}</p>`;return}
 el.innerHTML=`<h3>Séances enregistrées</h3>${SEANCES.slice(0,6).map(s=>`<details><summary><span class="num">${dm(s.date)}</span>&nbsp;·&nbsp;${esc(s.titre)}</summary><ul class="small" style="margin:0 0 8px;padding-left:20px">${(s.lignes||[]).map(l=>`<li>${esc(l)}</li>`).join("")}</ul></details>`).join("")}`}

function renderAll(){renderSemaine();renderCourse();renderObjectif();renderSaved()}
function bindApprove(){}
show(VIEW);renderSalle();renderAll();
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{SNAP=d.strava||null;EF=d.ef||null;BOX=d.box||null;COACH=d.coach||null;MAJ=d.maj||null;renderAll()}).catch(()=>renderAll());
if("serviceWorker" in navigator){let reloaded=false;const had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
 addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}))}
writeNotif();
</script>
